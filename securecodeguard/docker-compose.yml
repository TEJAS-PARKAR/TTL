version: '3.8'

services:
  securecodeguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securecodeguard-app
    restart: unless-stopped
    ports:
      - "8501:8501"
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./reports:/app/reports
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral:7b-instruct-v0.3-q4_K_M
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - scg-network

networks:
  scg-network:
    driver: bridge
